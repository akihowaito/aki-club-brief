<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="pages-title pages-desc">
  <title id="pages-title">粉白叠页 · AKI 定制网页标志</title>
  <desc id="pages-desc">柔粉色立体底板，清透冷白纸页、玫瑰粉底页与小星，少量浅蓝页面内容。纯 SVG，外部背景透明。</desc>
  <defs>
    <linearGradient id="pages-tile" x1="42" y1="31" x2="212" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDF3F8"/>
      <stop offset=".48" stop-color="#F3DDE9"/>
      <stop offset="1" stop-color="#E7BDCF"/>
    </linearGradient>
    <linearGradient id="pages-tile-depth" x1="128" y1="95" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDD2DF"/>
      <stop offset="1" stop-color="#D59BB7"/>
    </linearGradient>
    <radialGradient id="pages-tile-gloss" cx=".2" cy=".1" r=".93">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pages-tile-clip"><rect x="34" y="26" width="188" height="188" rx="49"/></clipPath>
    <filter id="pages-turn-light" x="-35%" y="-45%" width="170%" height="190%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <linearGradient id="pages-pink" x1="72" y1="64" x2="124" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5CEE0"/>
      <stop offset="1" stop-color="#D497B5"/>
    </linearGradient>
    <linearGradient id="pages-paper" x1="85" y1="53" x2="188" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FCFCFF"/>
      <stop offset="1" stop-color="#EAF0F6"/>
    </linearGradient>
    <linearGradient id="pages-fold" x1="154" y1="57" x2="181" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FCFF"/>
      <stop offset="1" stop-color="#C3D3E3"/>
    </linearGradient>
    <linearGradient id="pages-screen" x1="99" y1="99" x2="165" y2="127" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDEEFE"/>
      <stop offset="1" stop-color="#AFC9E8"/>
    </linearGradient>
    <linearGradient id="pages-star" x1="175" y1="142" x2="204" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9DDEB"/>
      <stop offset="1" stop-color="#D998B9"/>
    </linearGradient>
    <filter id="pages-tile-shadow" x="-30%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#B77C98" flood-opacity=".15"/>
    </filter>
    <filter id="pages-paper-shadow" x="-35%" y="-25%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#8C788B" flood-opacity=".22"/>
    </filter>
    <filter id="pages-star-shadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#AE7892" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#pages-tile-shadow)">
    <rect x="35.5" y="28.5" width="188" height="188" rx="49" fill="url(#pages-tile-depth)"/>
    <rect x="34" y="26" width="188" height="188" rx="49" fill="url(#pages-tile)"/>
    <g clip-path="url(#pages-tile-clip)">
      <rect x="34" y="26" width="188" height="188" rx="49" fill="url(#pages-tile-gloss)"/>
      <path d="M46 99V78c0-26 14-39 41-39h65" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="3.5" stroke-linecap="round" filter="url(#pages-turn-light)"/>
      <path d="M210 148v13c0 27-17 40-45 40h-24" fill="none" stroke="#B47A94" stroke-opacity=".10" stroke-width="4" stroke-linecap="round" filter="url(#pages-turn-light)"/>
    </g>
  </g>
  <g filter="url(#pages-paper-shadow)">
    <rect x="65" y="69" width="105" height="132" rx="15" transform="rotate(-10 117.5 135)" fill="url(#pages-pink)" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".60" stroke-width="1.2"/>
    <path d="M94 54h59l35 34v93c0 9-5 14-14 14H94c-9 0-14-5-14-14V68c0-9 5-14 14-14z" fill="url(#pages-paper)" fill-opacity="1" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="1.2"/>
    <path d="M153 55v20c0 9 5 14 14 14h20z" fill="url(#pages-fold)"/>
    <path d="M153 58v17c0 9 5 14 14 14h17" fill="none" stroke="#91A8BA" stroke-opacity=".33" stroke-width="1.5"/>
    <path d="M94 74h36" fill="none" stroke="#B87099" stroke-width="5" stroke-linecap="round"/>
    <rect x="94" y="99" width="68" height="31" rx="7" fill="url(#pages-screen)"/>
    <path d="M102 106h28" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <path d="M97 147h62M97 163h43" fill="none" stroke="#9FAEC1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M87 75v99" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#pages-star-shadow)">
    <path d="M187 140c3 11 8 16 20 19-12 3-17 8-20 20-3-12-8-17-20-20 12-3 17-8 20-19z" fill="url(#pages-star)" stroke="#FFF2F7" stroke-width="1.3"/>
    <path d="M182 155c2-1 4-4 5-7" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2.3" stroke-linecap="round"/>
  </g>
